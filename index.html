<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Cats</title><link rel="icon" href="nocats.svg?v=3" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=4"></head>
<body><main><header><a href="./" class="logo">A cat-free internet starts here.<span class="dot"></span></a><img class="brand-icon" src="nocats.svg" alt="No Cats"><button id="another" type="button">Declaw another site</button></header><section class="entry"><form id="form"><div class="options"><span id="redact-label">Redact</span><button id="mode" class="switch" type="button" role="switch" aria-checked="false" aria-label="Replace cat words instead of redacting"><span></span></button><label for="replacement">Replace with</label><input id="replacement" type="text" value="demon" maxlength="80" aria-label="Replacement term" autocomplete="off" spellcheck="false"></div><div class="url-row"><label class="sr" for="url">Webpage URL</label><input id="url" name="url" type="text" inputmode="url" placeholder="Paste a webpage URL" autocomplete="url" required><button id="submit">Declaw →</button></div></form>

<p id="status" role="status" aria-live="polite"></p>

</section></main><section id="result" hidden><div class="bar"><span id="summary"></span><button id="close" aria-label="Close preview">✕</button></div><iframe id="preview" title="Webpage with cat words redacted" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe></section><script src="config.js"></script><script type="module" src="app.js?v=4"></script></body></html>
